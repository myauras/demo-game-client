<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1626">
<title>空投爭奪</title>
<!-- 樣式：base 最先（變數與疊層表），其餘模組樣式在後 -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/log-ui.css">
<link rel="stylesheet" href="css/autobet.css">
<link rel="stylesheet" href="css/recent.css">
</head>
<body>
<!--
  script 載入順序（固定，不可調換）：
    values.js        數值單點（EV、DEMO_KEY）
    js/env.js        DEMO 命名空間、網址參數、DEMO.ls 存檔 helper、?vw=
    js/strings.js    字典＋t()＋data-t 自動填骨架字（其餘 UI 檔取字時字典要先在）
    js/toast.js      Toast（無依賴小元件）
    js/core.js       零 DOM 核心 DemoCore（盤面公告／下注契約／存檔）
    js/drag-scroll.js 拖曳滾動（log 頁、彈窗內容區用）
    js/log-ui.js     勝負 log 頁（不認識玩法，吃 LogUI.push(rec)）
    js/autobet.js    自動下注（不認識玩法，吃 adapter）
    js/ui-main.js    主畫面與演出（地圖、落點、封盤倒數、揭曉、結果彈窗）＋把 log／autobet／recent 接起來
    js/dev.js        ?dev=1 導演台＋?shot= 自動駕駛（最後載入，設 __shotReady）
    （H04 的 js/recent.js 會追加在 dev.js 之後；ui-main 的 Recent 區段會等它出現再掛）
-->
<div id="app">
  <!-- 頂欄：標題＋錢包＋紀錄鈕（只留這三樣） -->
  <div class="ptop">
    <span class="logo">🪂</span>
    <div class="ttl" data-t="top.title"></div>
    <div class="wallet"><small data-t="top.wallet"></small><b id="wal">10,000</b></div>
    <button id="logBtn" class="iconb" type="button" data-t="top.log" data-t-attr="title">📜</button>
  </div>

  <!-- 導演台（?dev=1 才顯示；dev.js 填內容） -->
  <div id="director"></div>

  <!-- 地圖：俯視島嶼＋四個落點（落點座標以 375×594 為基準換算成百分比，見 ui-main ZONE） -->
  <div class="map" id="map" data-ph="idle">

</g>
<path d="M 166 60 C 178 215, 200 400, 210 594" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2.5" stroke-dasharray="8 6"/>
</svg>
    <span class="plane" id="plane">✈️</span>

    <!-- 對手喊話（待命才顯示；封盤時喊話處只放 🔒） -->
    <div class="disc" data-t="map.disc"></div>
    <div class="ban" id="ban"></div>
    <div class="chipr" data-t="map.land"></div>

    <!-- 四個落點（ui-main 建） -->
    <div class="zones" id="zones"></div>
    <!-- 跳傘的傘兵（ui-main 建） -->
    <div class="sprites" id="sprites"></div>

    <!-- 封盤倒數：警示條＋紅框＋大字倒數卡（數字、一行提示、進度條、🔒） -->
    <div class="hz"></div>
    <div class="frame"></div>
    <div class="cd" id="cd">
      <div class="num" id="cdNum">3</div>
      <div class="tx"><span id="cdSub"></span><div class="seg" id="cdSeg"></div></div>
      <div class="lk" aria-hidden="true">🔒</div>
    </div>

    <!-- 大獎：金光＋爆金幣層（ui-main 的 coinBurst 填） -->
    <div class="glow" id="glow"></div>
    <div class="coins" id="coins"></div>

    <!-- 結果彈窗（蓋在地圖中央；點任一處收起） -->
    <div class="popveil" id="popveil"><div class="pop" id="pop"></div></div>
  </div>

  <!-- 下注面板：自動下注狀態槽（固定 40px）＋單注列／封盤列＋近況掛點 -->
  <div class="panel" id="panel">
    <!-- Autobet slot：autobet.js 會把 #abar 當浮條（固定高度槽，不跳版） -->
    <div class="aslot"><div id="abar"></div></div>
    <div class="brow">
      <div class="stakerow">
        <span class="stakelab" data-t="bet.stake"></span>
        <div class="stakes" id="stakes"></div>
        <!-- Autobet entryBtn：「⟳ 自動」文字鈕 -->
        <button class="autob" id="autoBtn" type="button" data-t="auto.btn" data-t-attr="title"><i>⟳</i><span data-t="auto.entry"></span></button>
      </div>
      <div class="lockrow">
        <button class="go" id="goBtn" type="button"></button>
      </div>
    </div>
    <!-- 近況掛點：內容由 H04（js/recent.js）填；H02 只留位置與固定高度 -->
    <div id="recent"></div>
  </div>
  <span class="ph" data-t="ph.art"></span>
  <!-- toast／log 頁／自動下注彈窗由各模組自建，掛進 #app -->
</div>
<script src="values.js"></script>
<script src="js/env.js"></script>
<script src="js/strings.js"></script>
<script src="js/toast.js"></script>
<script src="js/core.js"></script>
<script src="js/drag-scroll.js"></script>
<script src="js/log-ui.js"></script>
<script src="js/autobet.js"></script>
<script src="js/ui-main.js"></script>
<script src="js/dev.js"></script>
<script src="js/recent.js"></script>
</body>
</html>
