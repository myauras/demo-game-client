<h1>空投爭奪｜三方向試玩</h1>
<p>同一個主題：選一個落點跳傘，同一點的人越少，拿到的物資越多。三個版本只差「撞車時怎麼算」，請都玩幾局再比較。建議用手機直式開啟。</p>
<a href="a/"><b>A　全拿制</b><span>你和 3 個對手各選一點。只有獨自一人的落點拿得到，撞車全部歸零。</span></a>
<a href="b/"><b>B　對分制</b><span>全場一起選。同一點的人平分物資，物資多少開獎才揭曉。</span></a>
<a href="c/"><b>C　混合制</b><span>你和 3 個對手各選一點。撞車平分，獨佔另有加成。</span></a>
<small>比稿用原型：美術為佔位、無音效，數值未定案。</small>
