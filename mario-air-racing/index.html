  <style>
    /* Lock the document boundary, including Safe Area and loading-screen drags.
       overflow:hidden alone does not disable Android Chrome pull-to-refresh. */
    html, body {
      overscroll-behavior-y: none;
      touch-action: none;
    }

    /* Cocos owns scrolling/dragging inside the canvas; keep input events intact. */
    #GameViewport, #GameDiv, #Cocos3dGameContainer, #GameCanvas {
      touch-action: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
      background: #000;
    }

    #GameViewport {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
      overflow: hidden;
    }

    #GameDiv {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: 0;
    }

    #Cocos3dGameContainer, #GameCanvas {
      width: 100%;
      height: 100%;
    }

    #AuraStaticLoading {
      position: absolute;
      inset: 0;
      z-index: 10;
      overflow: hidden;
      pointer-events: none;
      background: #142f36;
      opacity: 1;
      transition: opacity 500ms ease;
    }

    #AuraStaticLoading.is-cocos-ready {
      opacity: 0;
    }

    #AuraStaticLoadingProgress {
      position: absolute;
      left: 50%;
      bottom: 10%;
      width: min(62%, 280px);
      height: 3px;
      overflow: hidden;
      transform: translateX(-50%);
      background: #375057;
    }

    #AuraStaticLoadingProgressValue {
      width: var(--aura-loading-progress, 0%);
      height: 100%;
      background: #f3c676;
    }

    @media (prefers-reduced-motion: reduce) {
      #AuraStaticLoading {
        transition: none;
      }
    }
  </style>

  <script>
    (function installAuraStaticLoading() {
      var shell = document.getElementById('AuraStaticLoading');
      var progressValue = document.getElementById('AuraStaticLoadingProgressValue');
      if (!shell || !progressValue) return;

      var visualProgress = 0;

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function setProgress(percent, allowComplete) {
        var normalized = clamp(Number(percent) || 0, 0, allowComplete ? 100 : 99);
        visualProgress = Math.max(visualProgress, normalized);
        progressValue.style.setProperty('--aura-loading-progress', visualProgress.toFixed(3) + '%');
      }

      window.auraStaticLoadingShell = {
        getProgress: function () {
          return visualProgress;
        },
        setProgress: function (percent) {
          if (!shell.hidden) setProgress(percent, false);
        },
        revealCocos: function () {
          if (shell.hidden || shell.classList.contains('is-cocos-ready')) return;
          setProgress(100, true);
          shell.classList.add('is-cocos-ready');
          window.setTimeout(function () {
            shell.hidden = true;

          }, 520);
        },
      };
    })();
  </script>
