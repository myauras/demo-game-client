<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11151c">
<title>骰子勇者 · Dice Hero</title>
<link rel="stylesheet" href="css/style.css?v=20261125f">
</head>
<body>
<main class="shell" id="shell" data-theme="geo">
  <header class="topbar">
    <div class="wallet" aria-label="模擬點數餘額"><span>點數</span><strong id="balance">1,000</strong></div>
  </header>
  <div class="statuses" id="statuses" aria-label="身上的狀態"></div>
  <section class="stage" id="stage" aria-label="地圖">
    <div class="board" id="board">
      <div class="world" id="world"></div>
      <div class="die-anchor">
        <div class="cube" id="cube">
          <div class="face f-top"></div><div class="face f-bottom"></div>
          <div class="face f-south"></div><div class="face f-north"></div>
          <div class="face f-east"></div><div class="face f-west"></div>
        </div>
        <div class="die-mod" id="dieMod" hidden></div>
      </div>
    </div>
    <div class="floats" id="floats" aria-hidden="true"></div>
    <div class="flash" id="flash" aria-hidden="true"></div>
  </section>
  <p class="message" id="message" role="status">點骰子旁邊的格子開始翻滾</p>
  <section class="controls" aria-label="操作">
    <div class="bets" id="bets" aria-label="底注"></div>
    <div class="buttons">
      <button id="rulesBtn" type="button">規則</button>
      <button id="themeBtn" type="button">風格：幾何</button>
      <button id="topupBtn" type="button">補點數</button>
    </div>
  </section>
  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle"></h2>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions"><button id="modalCancel" type="button">取消</button><button id="modalOk" type="button" class="primary">確定</button></div>
    </div>
  </div>
  <div class="bigwin" id="bigwin" hidden><div class="coins" id="coins" aria-hidden="true"></div><div class="bigwin-card"><span>大獎</span><strong id="bigwinAmount">0</strong></div></div>
</main>
<script src="js/game.js?v=20261125g"></script>
<script src="js/app.js?v=20261125f"></script>
</body>
</html>
