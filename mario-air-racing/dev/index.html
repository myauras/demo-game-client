html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;font-family:Arial,sans-serif}

[hidden]{display:none!important}
dialog{background:#203c44;color:#fff2d6;border:1px solid #748d88;border-radius:15px;box-shadow:0 10px 36px #0005;max-width:min(88vw,390px);padding:22px;font:16px/1.45 Arial,sans-serif}
dialog::backdrop{background:#071720a8}dialog h2{font-size:21px;margin:0 0 12px}dialog p{margin:0 0 16px;white-space:pre-line}dialog p:empty{display:none}

.actions{display:flex;gap:10px;justify-content:flex-end}.actions button,#failure button{background:#eabe79;border:1px solid #fff1c3;color:#362b20;font-weight:bold;padding:8px 17px;border-radius:8px;cursor:pointer}
#cancel{background:#304d54;color:#ffefcf;border-color:#6a8380}
#failure{position:absolute;inset:0;background:#142d34;display:grid;align-content:center;justify-items:center}
