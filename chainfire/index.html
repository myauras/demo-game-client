<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>烽火連環船｜Demo</title>
<style>
  /* ── 拋棄式資產：版面與樣式 ──
     效能守則（舊手機）：動畫只用 transform/opacity；無 blur/陰影動畫；
     同時動畫元素封頂 ~20；JS 不逐幀跑。 */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; }
  body { background: #17150f; font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
         display: flex; align-items: center; justify-content: center; color: #e8e2d4; }
  button { font-family: inherit; border: 0; cursor: pointer; }
  button:disabled { cursor: default; }

  #phone { width: 375px; height: 812px; background: #0d1b2e; display: flex; flex-direction: column;
           overflow: hidden; position: relative; border-radius: 24px;
           box-shadow: 0 0 0 6px #23201c, 0 24px 60px rgba(0,0,0,.6); }
  @media (max-width: 420px), (max-height: 860px) {
    #phone { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
  }

  /* 頂欄 */
  #top { height: 46px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 10px;
         background: rgba(0,0,0,.25); }
  #avatar { width: 26px; height: 26px; border-radius: 50%; background: #2a4568; flex: none; }
  #balance-box { font-size: 11px; color: #8a9cb5; }
  #balance { font-size: 15px; color: #ffb547; font-weight: 700; margin-left: 4px; font-variant-numeric: tabular-nums; }
  #wind-badge { margin-left: auto; font-size: 11px; padding: 4px 8px; border-radius: 10px;
                background: #1b3555; color: #8a9cb5; }
  #wind-badge.gentle    { background: #1b3555; color: #9fc3ee; }
  #wind-badge.standard  { background: #112; color: #c9a227; }
  #wind-badge.east_wind { background: #3a1408; color: #ff8a3d; }
  .icon-btn { width: 28px; height: 28px; border-radius: 6px; background: #1b3555; color: #8a9cb5;
              font-size: 13px; flex: none; }

  /* 倍率區 */
  #mult-zone { flex: none; text-align: center; padding: 8px 0 4px; }
  #mult { font-size: 46px; font-weight: 800; color: #ffb547; line-height: 1.05;
          font-variant-numeric: tabular-nums; letter-spacing: 1px; width: 74%; margin: 0 auto;
          transition: color .3s; }
  #mult.pop { animation: pop .3s; }
  @keyframes pop { 40% { transform: scale(1.14); } 100% { transform: scale(1); } }
  #mult.lose { color: #5b6b82; }
  #mult-sub { font-size: 12px; color: #8a9cb5; margin-top: 2px; min-height: 16px; }

  /* ── 江面：捲動場景（fx.js 動態生成內容）── */
  #river { flex: 1; min-height: 170px; margin: 4px 10px; border-radius: 8px; position: relative;
           background: linear-gradient(#0d1b2e 0%, #12233c 70%, #1b3555 100%); overflow: hidden;
           transition: background .8s; }
  #river.wind-gentle    { background: linear-gradient(#14263f 0%, #1a3050 70%, #234066 100%); }
  #river.wind-standard  { background: linear-gradient(#0d1b2e 0%, #12233c 70%, #1b3555 100%); }
  #river.wind-east_wind { background: linear-gradient(#20100a 0%, #2a0f08 70%, #3a1408 100%); }

  #world { position: absolute; left: 0; bottom: 0; top: 0; will-change: transform;
           transition: transform .9s cubic-bezier(.4,.1,.3,1); transform-origin: left bottom; }

  .wave { position: absolute; left: 0; bottom: 0; height: 46px; width: 200%;
          background: repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 40px, transparent 40px 80px);
          border-top: 2px solid rgba(159,195,238,.18); }
  .wave.w2 { bottom: 18px; height: 28px; opacity: .5; }
  .wave { animation: waveMove linear infinite; animation-duration: 9s; }
  .wave.w2 { animation-duration: 13s; animation-direction: reverse; }
  @keyframes waveMove { from { transform: translateX(0); } to { transform: translateX(-80px); } }
  .wind-east_wind .wave { animation-duration: 3.5s; }
  .wind-east_wind .wave.w2 { animation-duration: 5s; }
  .wind-gentle .wave { animation-duration: 14s; }

  #chain { position: absolute; bottom: 58px; height: 0; border-top: 3px dashed #7a6420; opacity: .8; }

  /* 船：倒梯形船身 + 桅杆帆旗（fx.js 生成） */
  .shipwrap { position: absolute; bottom: 34px; width: 88px; height: 150px; }
  .hull { position: absolute; bottom: 0; width: 88px; height: 52px; background: #2a4568;
          clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%);
          display: flex; align-items: center; justify-content: center;
          transition: background .4s; }
  .hull b { color: rgba(255,255,255,.4); font-size: 13px; }
  .mast { position: absolute; bottom: 50px; left: 42px; width: 4px; height: 84px; background: #4a3a28; }
  .sail { position: absolute; bottom: 66px; left: 10px; width: 66px; height: 56px;
          background: #c8b48c; clip-path: polygon(6% 0, 94% 0, 100% 100%, 0 100%);
          opacity: .92; transition: background .4s, opacity .4s; }
  .flag { position: absolute; bottom: 128px; left: 46px; width: 26px; height: 14px; background: #c9a227;
          clip-path: polygon(0 0, 100% 20%, 78% 50%, 100% 80%, 0 100%);
          transform-origin: left center; animation: flagSway ease-in-out infinite alternate; animation-duration: 1.6s; }
  @keyframes flagSway { from { transform: scaleX(.86) skewY(-4deg); } to { transform: scaleX(1.04) skewY(5deg); } }
  .wind-gentle .flag { animation-duration: 2.6s; }
  .wind-east_wind .flag { animation-duration: .5s; background: #e8531f; }

  /* 三態 */
  .shipwrap.burning .hull { background: #7a3a14; }
  .shipwrap.burning .sail { background: #e8531f; opacity: .85; }
  .shipwrap.burned .hull { background: #241a14; }
  .shipwrap.burned .sail { background: #3a2a22; opacity: .5; clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%); }
  .shipwrap.burned .flag { opacity: 0; }
  .shipwrap.burned .glow { position: absolute; bottom: 0; width: 88px; height: 10px;
          background: linear-gradient(90deg, transparent, rgba(232,83,31,.5), transparent); }
  .shipwrap.ext .hull { background: #22334c; }
  .shipwrap.ext .sail { opacity: .35; }
  .shipwrap.ext .flag { opacity: 0; }

  /* 火焰：燃燒中的那一艘（3 個元素）；燒穿後決策等待期間保留餘焰（縮小） */
  .flames { position: absolute; bottom: 44px; left: 14px; width: 60px; height: 70px; display: none; }
  .burning .flames { display: block; }
  .burned.hot .flames { display: block; transform: scale(.62); transform-origin: bottom center; opacity: .85; }
  .flames i { position: absolute; bottom: 0; width: 22px; height: 44px; background: linear-gradient(#ffb547, #e8531f);
              border-radius: 50% 50% 40% 40% / 70% 70% 30% 30%; transform-origin: bottom center;
              animation: flick ease-in-out infinite alternate; }
  .flames i:nth-child(1) { left: 0; animation-duration: .34s; }
  .flames i:nth-child(2) { left: 19px; height: 62px; width: 26px; animation-duration: .27s;
                           background: linear-gradient(#ffe28a, #ff8a3d); }
  .flames i:nth-child(3) { left: 40px; animation-duration: .41s; }
  @keyframes flick { from { transform: scaleY(.82) scaleX(.94); opacity: .85; }
                     to   { transform: scaleY(1.12) scaleX(1.02); opacity: 1; } }
  .wind-east_wind .flames i { animation-duration: .18s !important; }

  /* 熄滅白煙：只在熄滅那一艘（2 個元素） */
  .smoke { position: absolute; bottom: 54px; left: 24px; width: 40px; height: 60px; display: none; }
  .ext .smoke { display: block; }
  .smoke i { position: absolute; bottom: 0; left: 8px; width: 20px; height: 20px; border-radius: 50%;
             background: rgba(200,200,205,.4); animation: rise 2.2s ease-out infinite; }
  .smoke i:nth-child(2) { left: 16px; animation-delay: 1.1s; }
  @keyframes rise { from { transform: translateY(0) scale(.7); opacity: .6; }
                    to { transform: translateY(-52px) scale(1.5); opacity: 0; } }

  #boat { position: absolute; bottom: 26px; width: 54px; height: 22px; background: #6b5518;
          clip-path: polygon(0 30%, 100% 0, 88% 100%, 8% 100%);
          animation: bob 2.4s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0) rotate(-1deg); } to { transform: translateY(-3px) rotate(1.5deg); } }

  #progress { position: absolute; top: 8px; right: 10px; font-size: 11px; color: #8a9cb5;
              background: rgba(0,0,0,.35); padding: 3px 8px; border-radius: 8px; font-variant-numeric: tabular-nums; }
  #restore-bar { position: absolute; top: 8px; left: 10px; font-size: 11px; color: #ffb547;
                 background: rgba(0,0,0,.55); padding: 4px 10px; border-radius: 8px; display: none; }
  #dim { position: absolute; inset: 0; background: #06090f; opacity: 0; pointer-events: none; transition: opacity .5s; }

  /* 階梯 */
  #ladder { flex: none; height: 50px; margin: 0 10px; background: rgba(0,0,0,.25); border-radius: 6px;
            overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  #ladder::-webkit-scrollbar { display: none; }
  #ladder-scroll { display: flex; gap: 4px; padding: 8px; width: max-content; }
  .lcell { width: 52px; height: 34px; border-radius: 4px; background: #1b3555; color: #8a9cb5;
           font-size: 12px; display: flex; align-items: center; justify-content: center;
           font-variant-numeric: tabular-nums; flex: none; }
  .lcell.past { background: #6e2f14; color: #ffb547; }
  .lcell.cur  { background: #e8531f; color: #fff; font-weight: 700; }

  /* 注額列 */
  #bet-row { flex: none; height: 44px; margin: 5px 10px 0; display: flex; gap: 6px; align-items: center; }
  #bet-row button, #bet-amount { height: 34px; border-radius: 6px; background: #1b3555; color: #c8d4e4; font-size: 14px; }
  #bet-minus, #bet-plus { width: 40px; font-size: 18px; }
  #bet-amount { flex: 1; display: flex; align-items: center; justify-content: center; font-weight: 700;
                color: #ffb547; font-variant-numeric: tabular-nums; }
  #bet-half, #bet-max { width: 48px; font-size: 12px; }
  #bet-row button:disabled { opacity: .35; }

  /* 自動收兵 */
  #auto-row { flex: none; height: 32px; margin: 5px 10px 0; display: flex; align-items: center; gap: 8px;
              font-size: 12px; color: #8a9cb5; }
  #auto-toggle { width: 34px; height: 20px; border-radius: 10px; background: #1b3555; position: relative; flex: none; }
  #auto-toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
                        border-radius: 50%; background: #5b6b82; transition: transform .2s, background .2s; }
  #auto-toggle.on { background: #c9a227; }
  #auto-toggle.on::after { transform: translateX(14px); background: #fff; }
  #auto-node { width: 44px; height: 26px; border-radius: 4px; border: 0; background: #1b3555; color: #ffb547;
               text-align: center; font-size: 13px; }
  #auto-row.disabled { opacity: .4; pointer-events: none; }

  /* 雙按鈕 */
  #actions { flex: none; height: 62px; margin: 7px 10px 0; display: flex; gap: 8px; }
  #actions button { flex: 1; border-radius: 8px; color: #fff; font-size: 18px; font-weight: 700; letter-spacing: 6px;
                    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  #actions button small { font-size: 10px; font-weight: 400; letter-spacing: 0; opacity: .85; }
  #btn-ignite { background: #e8531f; }
  #btn-continue { background: #e8531f; display: none; }
  #btn-cash { background: #c9a227; display: none; }
  #actions button:disabled { filter: grayscale(.7) brightness(.6); }

  /* 倒數條（scaleX，不觸發重排） */
  #timer-wrap { flex: none; height: 6px; margin: 7px 10px 0; border-radius: 3px; background: rgba(0,0,0,.3);
                overflow: hidden; visibility: hidden; }
  #timer-bar { height: 100%; width: 100%; background: #e8531f; transform-origin: left center; }

  /* 底欄 */
  #foot { flex: none; height: 30px; margin: 7px 10px 12px; display: flex; align-items: center; gap: 8px;
          background: rgba(0,0,0,.3); border-radius: 6px; padding: 0 10px; font-size: 11px; overflow: hidden; }
  #foot .jp-label { color: #c9a227; flex: none; }
  #jackpot { color: #ffb547; font-weight: 700; font-variant-numeric: tabular-nums; flex: none; }
  #ticker-clip { flex: 1; overflow: hidden; position: relative; height: 100%; }
  #ticker { position: absolute; white-space: nowrap; color: #5b6b82; line-height: 30px; will-change: transform;
            animation: tick 9s linear infinite; }
  @keyframes tick { from { transform: translateX(240px); } to { transform: translateX(-105%); } }

  /* 彈窗（規則/歷史/設定） */
  .modal-mask { position: absolute; inset: 0; background: rgba(0,0,0,.6); z-index: 20; display: none;
                align-items: flex-end; }
  .modal-mask.open { display: flex; }
  .modal { width: 100%; max-height: 78%; background: #12233c; border-radius: 16px 16px 0 0;
           padding: 16px 14px 20px; overflow-y: auto; font-size: 12px; color: #c8d4e4; }
  .modal h3 { font-size: 15px; color: #ffb547; margin-bottom: 10px; }
  .modal h4 { font-size: 12px; color: #8a9cb5; margin: 12px 0 6px; }
  .modal table { border-collapse: collapse; width: 100%; font-size: 11px; font-variant-numeric: tabular-nums; }
  .modal th, .modal td { border: 1px solid #1b3555; padding: 4px 6px; text-align: right; }
  .modal th { background: #0d1b2e; color: #8a9cb5; font-weight: 600; }
  .modal td:first-child, .modal th:first-child { text-align: left; }
  .modal p { line-height: 1.8; margin: 6px 0; }
  .modal .close { position: sticky; float: right; top: 0; width: 28px; height: 28px; border-radius: 6px;
                  background: #1b3555; color: #8a9cb5; }
  .modal .fair-btn { margin-top: 10px; width: 100%; height: 32px; border-radius: 6px; background: #1b3555; color: #8a9cb5; }

  #settings-panel { position: absolute; top: 50px; right: 10px; width: 240px; background: #12233c;
                    border: 1px solid #2a4568; border-radius: 10px; padding: 14px; z-index: 25;
                    font-size: 12px; color: #c8d4e4; display: none; }
  #settings-panel.open { display: block; }
  #settings-panel h4 { font-size: 12px; color: #8a9cb5; margin: 10px 0 6px; font-weight: 600; }
  #settings-panel h4:first-child { margin-top: 0; }
  #settings-panel label { display: flex; align-items: center; gap: 6px; padding: 4px 0; cursor: pointer; }
  #btn-reset-wallet { margin-top: 10px; width: 100%; height: 30px; border-radius: 6px; background: #1b3555; color: #8a9cb5; font-size: 12px; }

  /* 通關覆蓋層 */
  #clear-overlay { position: absolute; inset: 0; z-index: 15; display: none; pointer-events: none;
                   background: radial-gradient(ellipse at 50% 60%, rgba(232,83,31,.55), rgba(13,27,46,.9));
                   align-items: center; justify-content: center; flex-direction: column; gap: 10px;
                   opacity: 0; transition: opacity .6s; }
  #clear-overlay.show { display: flex; opacity: 1; }
  #clear-overlay b { font-size: 44px; color: #ffe28a; letter-spacing: 10px; font-weight: 800; }
  #clear-overlay span { font-size: 15px; color: #ffb547; font-variant-numeric: tabular-nums; }

  /* 派彩飄字 */
  #payout-fly { position: absolute; top: 40px; left: 90px; font-size: 14px; font-weight: 700; color: #ffe28a;
                opacity: 0; pointer-events: none; z-index: 12; }
  #payout-fly.go { animation: flyup .9s ease-out; }
  @keyframes flyup { 0% { opacity: 0; transform: translateY(10px); } 25% { opacity: 1; }
                     100% { opacity: 0; transform: translateY(-26px); } }

  #toast { position: absolute; left: 50%; top: 120px; transform: translateX(-50%); max-width: 86%;
           background: rgba(0,0,0,.85); color: #ffb547; font-size: 12px; padding: 10px 16px;
           border-radius: 8px; z-index: 30; display: none; text-align: center; line-height: 1.6; }
</style>
</head>
<body>

<div id="phone">
  <header id="top">
    <div id="avatar"></div>
    <div id="balance-box">餘額<b id="balance">--</b></div>
    <div id="payout-fly"></div>
    <div id="wind-badge">待點火</div>
    <button class="icon-btn" id="btn-history">歷</button>
    <button class="icon-btn" id="btn-rules">規</button>
    <button class="icon-btn" id="btn-settings">⚙</button>
  </header>

  <section id="mult-zone">
    <div id="mult">--</div>
    <div id="mult-sub">設定注額後點火出擊</div>
  </section>

  <section id="river">
    <div id="world"></div>
    <div id="dim"></div>
    <div id="progress">0 / 12</div>
    <div id="restore-bar">已為你保留上一局進度</div>
  </section>

  <section id="ladder"><div id="ladder-scroll"></div></section>

  <section id="bet-row">
    <button id="bet-minus">−</button>
    <div id="bet-amount">100</div>
    <button id="bet-plus">＋</button>
    <button id="bet-half">1/2</button>
    <button id="bet-max">MAX</button>
  </section>

  <section id="auto-row">
    <div id="auto-toggle"></div>
    <span>自動收兵：燒到第</span>
    <input id="auto-node" type="number" min="1" max="12" value="8">
    <span>節</span>
  </section>

  <section id="actions">
    <button id="btn-ignite">點 火 出 擊<small id="ignite-sub"></small></button>
    <button id="btn-continue">續 燒<small id="cont-sub"></small></button>
    <button id="btn-cash">收 兵<small id="cash-sub"></small></button>
  </section>

  <div id="timer-wrap"><div id="timer-bar"></div></div>

  <footer id="foot">
    <span class="jp-label">獎池</span><b id="jackpot">--</b>
    <div id="ticker-clip"><div id="ticker"></div></div>
  </footer>

  <div id="settings-panel">
    <h4>逾時（3 秒未操作）</h4>
    <label><input type="radio" name="timeout" value="continue" checked>自動續燒（預設）</label>
    <label><input type="radio" name="timeout" value="cash_out">自動收兵</label>
    <h4>演出</h4>
    <label><input type="checkbox" id="opt-compress" checked>連續遊玩時演出加速（40%）</label>
    <button id="btn-reset-wallet">重置錢包（Demo 專用）</button>
  </div>

  <div class="modal-mask" id="rules-mask"><div class="modal" id="rules-modal"></div></div>
  <div class="modal-mask" id="history-mask"><div class="modal" id="history-modal"></div></div>

  <div id="clear-overlay"><b>火燒連營</b><span id="clear-amount"></span></div>
  <div id="toast"></div>
</div>

<!-- 普通 script 串接（file:// 雙擊直開）。順序：tables → mock-server → fx → game -->
<script src="js/tables.js"></script>
<script src="js/mock-server.js"></script>
<script src="js/fx.js"></script>
<script src="js/game.js"></script>
</body>
</html>
