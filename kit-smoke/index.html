<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E120F">
<title>三選一冒煙</title>
<!-- 樣式：base 最先（變數與疊層表），其餘模組樣式在後 -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/log-ui.css">
<link rel="stylesheet" href="css/autobet.css">
<link rel="stylesheet" href="css/onboard.css">
</head>
<body>
<!--
  script 載入順序（固定，不可調換）：
    values.js        數值單點（EV、DEMO_KEY）
    js/env.js        DEMO 命名空間、網址參數、DEMO.ls 存檔 helper、?vw=
    js/strings.js    字典＋t()＋data-t 自動填骨架字（其餘 UI 檔取字時字典要先在）
    js/toast.js      Toast（無依賴小元件）
    js/core.js       零 DOM 核心 DemoCore（錢包／下注契約／存檔）
    js/drag-scroll.js 拖曳滾動（log 頁、彈窗內容區用）
    js/log-ui.js     勝負 log 頁（不認識玩法，吃 LogUI.push(rec)）
    js/autobet.js    自動下注（不認識玩法，吃 adapter）
    js/onboard.js    新手引導骨架（吃 steps）
    js/ui-main.js    範例玩法畫面與演出＋把上面幾個模組接起來（拋棄式，新 demo 整個換掉）
    js/dev.js        ?dev=1 導演台＋?shot= 自動駕駛（最後載入，設 __shotReady）
-->
<div id="app">
  <!-- 頂欄：餘額＋log 入口 -->
  <div class="ptop">
    <span class="wallet">💰 <span id="wal">10,000</span></span>
    <button id="logBtn" class="iconb" type="button" data-t="top.log" data-t-attr="title">📜</button>
  </div>

  <!-- 新手引導常駐提示（onboard.js 填內容） -->
  <div id="hint"></div>

  <!-- 導演台（?dev=1 才顯示；dev.js 填內容） -->
  <div id="director"></div>

  <!-- 範例玩法・主區（範例，換掉） -->
  <div class="stage" id="stage">
    <div class="banner" id="banner" data-t="banner.idle"></div>
    <div class="cards" id="cards"></div>
    <div class="net" id="net"></div>
  </div>

  <!-- 下注面板：單注列（含 ⟳ 自動下注入口）＋自動下注槽 -->
  <div class="panel" id="panel">
    <div class="stakerow">
      <span class="stakelab" data-t="bet.stake"></span>
      <div class="stakes" id="stakes"></div>
      <button class="autob" id="autoBtn" type="button" data-t="auto.btn" data-t-attr="title">⟳</button>
    </div>
    <div id="abar"></div>
  </div>
  <!-- toast／log 頁／自動下注彈窗／引導覆蓋層由各模組自建，掛進 #app -->
</div>
<script src="values.js"></script>
<script src="js/env.js"></script>
<script src="js/strings.js"></script>
<script src="js/toast.js"></script>
<script src="js/core.js"></script>
<script src="js/drag-scroll.js"></script>
<script src="js/log-ui.js"></script>
<script src="js/autobet.js"></script>
<script src="js/onboard.js"></script>
<script src="js/ui-main.js"></script>
<script src="js/dev.js"></script>
</body>
</html>
