<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080B12">
<title>連鎖開箱</title>
<!-- 樣式：base 最先（變數與疊層表），其餘模組樣式在後；extras.css 屬 C04 -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/log-ui.css">
<link rel="stylesheet" href="css/autobet.css">
<link rel="stylesheet" href="css/onboard.css">
<link rel="stylesheet" href="css/extras.css">
</head>
<body>
<!--
  script 載入順序（固定，不可調換）：
    values.js        數值單點（EV、DEMO_KEY）
    js/env.js        DEMO 命名空間、網址參數、DEMO.ls 存檔 helper、?vw=
    js/strings.js    字典＋t()＋DEMO.addStrings＋data-t 自動填骨架字
    js/toast.js      Toast
    js/core.js       零 DOM 核心 DemoCore（錢包／下注契約／存檔）
    js/drag-scroll.js 拖曳滾動
    js/log-ui.js     勝負 log 頁（不認識玩法）
    js/autobet.js    自動下注（不認識玩法）
    js/onboard.js    新手引導骨架（本作不啟動，只保留載入）
    js/ui-main.js    主畫面與連鎖演出（C02）；對外 DEMO.ui
    js/wire.js       接線：LogUI／Autobet／紀錄徽章…（C03，目前空殼）
    js/extras.js     再玩動機與加分演出（C04，目前空殼）
    js/dev.js        ?dev=1 導演台＋?shot= 自動駕駛（最後載入，設 __shotReady）
-->
<div id="app">
  <!-- 符號表：七種箱子各一個符號（紅▲ 藍■ 綠● 橘✚ 紫◆ 青⬢ 白銀★） -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="sy0" viewBox="0 0 24 24"><path d="M12 3 L22 20.5 H2 Z"/></symbol>
    <symbol id="sy1" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></symbol>
    <symbol id="sy2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></symbol>
    <symbol id="sy3" viewBox="0 0 24 24"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></symbol>
    <symbol id="sy4" viewBox="0 0 24 24"><path d="M12 2 L22 12 L12 22 L2 12 Z"/></symbol>
    <symbol id="sy5" viewBox="0 0 24 24"><path d="M12 2 L21 7 V17 L12 22 L3 17 V7 Z"/></symbol>
    <symbol id="sy6" viewBox="0 0 24 24"><path d="M12 2l3 7 7.4.6-5.6 4.8 1.8 7.2L12 17.7 5.4 21.6l1.8-7.2L1.6 9.6 9 9z"/></symbol>
  </defs></svg>

  <!-- 頂欄：餘額＋紀錄入口 -->
  <div class="bar">
    <div class="bal"><span class="coin"><i></i></span><b id="wal">10,000</b></div>
    <button id="logBtn" class="logb" type="button" data-t="top.log" data-t-attr="title">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
    </button>
  </div>

  <!-- 新手引導常駐提示：本作不做引導，永遠不顯示（掛點保留） -->
  <div id="hint"></div>
  <!-- 導演台（?dev=1 才顯示；dev.js 填內容） -->
  <div id="director"></div>

  <!-- 檔位三選一 -->
  <div class="tiers" id="tiers"></div>
  <!-- 自動下注進行中浮條（autobet.js 管；待命時隱藏，進行中蓋在檔位列上） -->
  <div id="abar"></div>

  <!-- 倍率階梯 -->
  <div class="ladder" id="ladder"></div>

  <!-- 盤面 -->
  <div class="rack" id="rack"><div class="grid" id="grid"></div></div>

  <!-- 這局戰利品 -->
  <div class="loot" id="loot">
    <div class="lh">
      <div class="cap"><svg width="13" height="12" viewBox="0 0 30 26" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><rect x="3" y="9" width="24" height="15" rx="2.5"/><path d="M3 14h24M5 9l3-5h14l3 5"/></svg><span data-t="main.loot"></span></div>
      <div class="slots" id="slots"></div>
    </div>
    <div class="tot zero" id="tot"><b id="totv">0</b></div>
  </div>

  <!-- 底部操作：注額、自動、最高紀錄、開箱 -->
  <div class="deck" id="panel"></div>
  <div class="col l" id="stakes"></div>
  <div class="col r" id="colr">
    <button id="autoBtn" class="btn2" type="button" data-t="auto.btn" data-t-attr="title">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 3.5V8h-4.5"/></svg>
      <span data-t="main.auto"></span>
    </button>
    <!-- 最高紀錄徽章：C02 只給位置與外框，內容（.rv）由 C04 填 -->
    <div class="best" id="recordBadge">
      <small data-t="main.best"></small>
      <b><svg width="16" height="13" viewBox="0 0 24 20" fill="currentColor"><path d="M2 5l5 5 5-8 5 8 5-5-2 13H4z"/></svg><span class="rv">—</span></b>
    </div>
  </div>
  <button id="goBtn" class="go" type="button">
    <span class="halo"></span><span class="ring2"></span><span class="rim"></span>
    <span class="disc">
      <svg width="26" height="22" viewBox="0 0 30 26" fill="none" stroke="#2b1600" stroke-width="2.4" stroke-linejoin="round"><rect x="3" y="9" width="24" height="15" rx="2.5" fill="rgba(80,40,0,.18)"/><path d="M3 14h24"/><rect x="12" y="12" width="6" height="5" rx="1" fill="#2b1600"/><path d="M5 9l3-5h14l3 5"/></svg>
      <b id="goTxt"></b>
    </span>
  </button>
  <div class="ph" data-t="main.placeholder"></div>

  <!-- 特效層（箱蓋、光、金幣、飛向餘額的金幣、大贏字）與大獎覆蓋層 -->
  <div id="fx"></div>
  <div id="jp" class="jp"></div>
  <!-- toast／log 頁／自動下注彈窗由各模組自建，掛進 #app -->
</div>
<script src="values.js"></script>
<script src="js/env.js"></script>
<script src="js/strings.js"></script>
<script src="js/toast.js"></script>
<script src="js/core.js"></script>
<script src="js/drag-scroll.js"></script>
<script src="js/log-ui.js"></script>
<script src="js/autobet.js"></script>
<script src="js/onboard.js"></script>
<script src="js/ui-main.js"></script>
<script src="js/wire.js"></script>
<script src="js/extras.js"></script>
<script src="js/dev.js"></script>
</body>
</html>
