<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1226">
<title>爆金連鎖</title>
<!-- 樣式：base 最先（變數與疊層表），其餘模組樣式在後（這款不做教學，不載 onboard.css） -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/log-ui.css">
<link rel="stylesheet" href="css/autobet.css">
<link rel="stylesheet" href="css/wire.css">
</head>
<body>
<!--
  script 載入順序（固定，不可調換）：
    values.js        數值單點（EV、DEMO_KEY）
    js/env.js        DEMO 命名空間、網址參數、DEMO.ls 存檔 helper、?vw=
    js/strings.js    字典＋t()＋data-t 自動填骨架字（其餘 UI 檔取字時字典要先在）
    js/toast.js      Toast（無依賴小元件）
    js/core.js       零 DOM 核心 DemoCore（錢包／下注契約／存檔）
    js/drag-scroll.js 拖曳滾動（log 頁、彈窗內容區用）
    js/log-ui.js     勝負 log 頁（不認識玩法，吃 LogUI.push(rec)）
    js/autobet.js    自動下注（不認識玩法，吃 adapter）
    js/art.js        美術：金幣／鑽石／皇冠／盤面（SVG 程式畫，畫一次重複用）與幾何
    js/fx.js         演出用的虛擬時間軸（可變速、可凍結）
    js/ui-main.js    主畫面與演出（B 案）＋DEMO.ui
    js/wire.js       接線：自動下注 adapter、勝負紀錄（LogUI）的詳細頁與補記
    js/dev.js        ?dev=1 導演台＋?shot= 自動駕駛（最後載入，設 __shotReady）
  js/onboard.js、css/onboard.css 這款不用（不做教學），檔案保留、不引用。
-->
<div id="app">
  <div id="world">
    <!-- 盤面（震動時整塊一起動）：底圖與格子狀態層／幣柱／寶物箭頭 -->
    <div id="stage">
      <svg id="scene" viewBox="0 0 375 812" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="cols"></div>
      <svg id="over" viewBox="0 0 375 812" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <svg id="hit" viewBox="0 0 375 812" xmlns="http://www.w3.org/2000/svg"></svg>

    <!-- 頂欄：餘額＋速度＋紀錄 -->
    <div class="top hud">
      <div class="bal" id="bal"><i class="ico cn"></i><b id="wal">10,000</b></div>
      <div class="tr">
        <button id="spdBtn" class="spd" type="button" aria-pressed="false">
          <svg width="22" height="18" viewBox="0 0 22 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l6 6-6 6"/><path d="M11 3l6 6-6 6" opacity=".55"/></svg>
        </button>
        <button id="logBtn" class="log" type="button" data-t="top.log" data-t-attr="title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
          <span data-t="top.logShort"></span>
        </button>
      </div>
    </div>

    <!-- 面額分頁（每個面額各一張盤面）：JS 填 -->
    <div class="tabs hud" id="tabs"></div>

    <!-- 天空帶：大連爆字樣、天降標籤 -->
    <div class="skyz"><div class="banner" id="banner"></div></div>
    <div class="tag" id="skyTag" data-t="sky.tag"></div>

    <!-- 收集槽（演出用，拿掉也不影響規則；JS 填內容）與這一下的金額 -->
    <div id="tray" class="hud"></div>
    <div id="amt" class="dim hud"><span id="amtN">0</span></div>

    <!-- 三樣東西各值多少 -->
    <div class="legend hud" id="legend"></div>

    <!-- 自動下注：浮條槽與入口（js/wire.js 接線） -->
    <div id="abar" class="hud"></div>
    <button id="autoBtn" class="autob hud" type="button" data-t="auto.btn" data-t-attr="title">
      <svg width="26" height="24" viewBox="0 0 24 22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10a7 7 0 0 1 12-4M19 2.5V7h-4.5M19.5 12a7 7 0 0 1-12 4M5 19.5V15h4.5"/></svg>
      <span data-t="auto.short"></span>
    </button>

    <div id="halo"></div>
    <div id="rays"></div>
    <div id="fx"></div>
    <div id="flash"></div>
  </div>

  <!-- 導演台（?dev=1 才顯示；js/dev.js 填內容，預設網址保持空的） -->
  <div id="director"></div>
  <!-- toast／log 頁／自動下注彈窗由各模組自建，掛進 #app -->
</div>
<script src="values.js"></script>
<script src="js/env.js"></script>
<script src="js/strings.js"></script>
<script src="js/toast.js"></script>
<script src="js/core.js"></script>
<script src="js/drag-scroll.js"></script>
<script src="js/log-ui.js"></script>
<script src="js/autobet.js"></script>
<script src="js/art.js"></script>
<script src="js/fx.js"></script>
<script src="js/ui-main.js"></script>
<script src="js/wire.js"></script>
<script src="js/dev.js"></script>
</body>
</html>
