<title>mario-air-racing</title><style>.keypad{position:absolute;inset:0;z-index:9;isolation:isolate;color:var(--on);--key-paper:var(--paper,var(--well))}

#GameViewport{position:fixed;inset:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);overflow:hidden}
#GameDiv{position:absolute;overflow:hidden;isolation:isolate}#GameDiv #gameHolder{width:100%;height:100%;margin:0}
#gameHolder{--on:#553d30;--paper:#fff4df;--chassis:#f2dfc1;--edge:#c5ad8a;--well:#fff9ec;--soft:#8c7057;--hud:#f0dfc1;--hudInk:#503829;--accent:#985840;--primary:#a86048;--primaryInk:#fff8e8;--rim:#d7bc94}
#world .stage{width:100%;height:100%;position:absolute;inset:0}.rateTag{transform:translate(-50%,0);pointer-events:none}
#leaderCrown,#passHeart,#championAward{transform:translate(-50%,-100%);pointer-events:none}
#leaderCrown{font:900 24px/1 Georgia,serif;color:#ffc32e;text-shadow:0 -1px #624315,1px 1px #624315,-1px 1px #624315;text-align:center}
#championAward{font:bold 14px/1.1 system-ui;text-align:center;white-space:pre-line}
#mast button{pointer-events:auto}.brand{border:0;background:none;padding:0}.brand b{font:inherit}
#mast .wallet{font:600 12px system-ui}.wallet img.creditIcon{display:block;width:15px;height:15px;border:0;box-shadow:none;background:none}
#stake{border:0;background:transparent;padding:0;font:650 16px/1 system-ui;color:#61483d;min-width:0}
.stepper{align-items:center}#entry .stepper{grid-template-columns:minmax(28px,44px) minmax(45px,1fr) minmax(28px,44px)}#stake span{white-space:nowrap}
#Utilities,#sheet{background:#fff3dd;color:#563e31;border:1px solid #b59a73;border-radius:10px;box-shadow:0 8px 24px #47321e36}
#Utilities{position:absolute;top:51px;left:10px;z-index:8;display:grid;grid-template-columns:repeat(2,minmax(80px,1fr));padding:5px;gap:3px}
#Utilities button,#sheet button,#failure button{font:650 15px system-ui;min-height:44px;padding:5px 12px;color:#61483d;background:#f3e2c8;border:1px solid #cdb392;border-radius:5px}
#sheet{padding:18px;width:min(86vw,360px);max-height:80dvh;overflow:auto}#sheet h2{font-size:20px;margin:0 0 9px}#sheet p{margin:0 0 12px;white-space:pre-line}#sheet p:empty{display:none}
#sheet::backdrop{background:#2f261c75}#sheet .dialog-actions{display:flex;justify-content:flex-end;gap:8px}
#volume label{display:flex;justify-content:space-between;margin:10px 0}#sheet input{accent-color:#a86048}
#failure{position:absolute;inset:0;display:grid;place-content:center;color:#61483d;background:#fff3dd}
.kp-coin{display:none}.kp-value .keypad-unit{color:#725644;font:700 3.2cqw/1 system-ui;padding-inline:1cqw}.kp-value input{min-width:0}.kp-key:focus-visible{outline-offset:-2px}
@media(prefers-reduced-motion:reduce){#raceScene{transition:none}}
